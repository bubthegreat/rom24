apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyrom-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pyrom
  template:
    metadata:
      labels:
        app: pyrom
    spec:
      # Reduce termination grace period for faster shutdowns
      terminationGracePeriodSeconds: 5
      volumes:
        - name: pyrom-player-storage
          persistentVolumeClaim:
            claimName: pyrom-player-pvc
        - name: pyrom-world-storage
          persistentVolumeClaim:
            claimName: pyrom-world-pvc
        - name: pyrom-system-storage
          persistentVolumeClaim:
            claimName: pyrom-system-pvc
      initContainers:
        - name: init-pyrom-data
          image: bubthegreat/pyrom:0.0.1-alpha2
          command: ['sh', '-c']
          args:
            - |
              # Copy player files if volume is empty
              if [ ! -d /pyrom-persistent/players/b ]; then
                echo "Initializing players directory..."
                cp -r /pyrom/src/data/players/* /pyrom-persistent/players/ || true
              fi
              
              # Copy world files if volume is empty
              if [ ! -d /pyrom-persistent/world/instances ]; then
                echo "Initializing world directory..."
                cp -r /pyrom/src/data/world/* /pyrom-persistent/world/ || true
              fi
              
              # Initialize system directory
              if [ ! -d /pyrom-persistent/system ]; then
                echo "Initializing system directory..."
                mkdir -p /pyrom-persistent/system
              fi
              
              echo "Initialization complete"
          volumeMounts:
            - name: pyrom-player-storage
              mountPath: /pyrom-persistent/players
            - name: pyrom-world-storage
              mountPath: /pyrom-persistent/world
            - name: pyrom-system-storage
              mountPath: /pyrom-persistent/system
      containers:
        - name: pyrom
          image: bubthegreat/pyrom:0.0.1-alpha2
          imagePullPolicy: Always
          env:
            - name: PYROM_PORT
              valueFrom:
                configMapKeyRef:
                  name: pyrom-config
                  key: PYROM_PORT
                  optional: true
            - name: PYROM_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: pyrom-config
                  key: PYROM_LOG_LEVEL
                  optional: true
            # Point to persistent storage directories
            - name: PYROM_PLAYER_DIR
              value: "/pyrom-persistent/players"
            - name: PYROM_WORLD_DIR
              value: "/pyrom-persistent/world"
            - name: PYROM_SYSTEM_DIR
              value: "/pyrom-persistent/system"
          ports:
            - containerPort: 1337
              name: telnet
          # Boot loads the whole world and can take 30-60s under load; keep
          # liveness/readiness disabled until the port is up (startupProbe).
          startupProbe:
            tcpSocket:
              port: 1337
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30   # up to ~150s to finish booting
          readinessProbe:
            tcpSocket:
              port: 1337
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # The server is single-threaded: a player save to the (slow) PVC or a
          # heavy pulse briefly blocks accept(). Tolerate that instead of killing
          # the pod on a 1s hiccup.
          livenessProbe:
            tcpSocket:
              port: 1337
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: pyrom-player-storage
              mountPath: /pyrom-persistent/players
            - name: pyrom-world-storage
              mountPath: /pyrom-persistent/world
            - name: pyrom-system-storage
              mountPath: /pyrom-persistent/system
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"

