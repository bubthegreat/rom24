apiVersion: v1
kind: Service
metadata:
  name: pyrom-service
spec:
  selector:
    app: pyrom
  ports:
    - protocol: TCP
      port: 1337
      targetPort: 1337
      name: telnet
  # ClusterIP: external traffic arrives via the shared homelab-gateway TCPRoute
  # (tcp-1337 prod / tcp-1338 dev), not a per-service LoadBalancer IP.
  type: ClusterIP
